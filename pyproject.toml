[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-ddl"
dynamic = ["version"]
description = "Deterministic multi-source Canvas and trusted course-document deadline engine"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29", "python-dotenv>=1.1,<2", "tzdata>=2025.2",
  "pypdf[crypto]>=6.19,<7", "python-docx>=1.1,<2", "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4", "beautifulsoup4>=4.12,<5", "striprtf>=0.0.28,<0.1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyyaml>=6,<7", "reportlab>=4,<5"]
ocr = ["paddleocr>=3.7,<3.8", "paddlepaddle>=3.2.1,<3.3", "pypdfium2>=4.30,<5"]

[project.scripts]
canvas-ddl = "canvas_ddl.cli.main:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "canvas_ddl.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
